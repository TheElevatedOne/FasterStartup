# Thunderstore package settings, read by publish.sh and the Makefile.
# Plain KEY=value lines (sourced by bash), no spaces around '='.
#
# VERSION is the release version: keep PluginVersion in src/Plugin/FasterStartupPlugin.cs and the top
# CHANGELOG.md entry in sync with it (publish.sh checks both).

NAMESPACE=ELEVATED
NAME=FasterStartup
VERSION=1.0.1
DESCRIPTION="Makes Risk of Rain 2 and your mods load faster: fixes a slow post-processing scan in modded games, lifts the loading screen frame cap and paces loading better. Reports which mods slow your startup."
WEBSITE_URL="https://github.com/TheElevatedOne/FasterStartup"

# Space-separated Thunderstore dependency strings (Namespace-Name-Version).
DEPENDENCIES="bbepis-BepInExPack-5.4.2122 RiskofThunder-RoR2BepInExPack-1.46.0 RiskofThunder-HookGenPatcher-1.2.9 Rune580-Risk_Of_Options-2.8.6"

# The README shown on Thunderstore (without building instructions); packaged as README.md.
README=thunderstore/README.md

# Where built zips are written.
OUTPUT_DIR=dist
